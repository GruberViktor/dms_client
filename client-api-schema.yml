components:
  schemas:
    ActionEnum:
      enum:
      - create
      - edit_metadata
      - edit_fields
      - version_upload
      - version_replace_file
      - version_hide
      - version_unhide
      - acl_change
      - type_change
      - download
      - view
      - archive
      - unarchive
      - delete
      - extraction_done
      - extraction_failed
      type: string
      description: |-
        * `create` - Create
        * `edit_metadata` - Edit Metadata
        * `edit_fields` - Edit Fields
        * `version_upload` - Version Upload
        * `version_replace_file` - Version Replace File
        * `version_hide` - Version Hide
        * `version_unhide` - Version Unhide
        * `acl_change` - Acl Change
        * `type_change` - Type Change
        * `download` - Download
        * `view` - View
        * `archive` - Archive
        * `unarchive` - Unarchive
        * `delete` - Delete
        * `extraction_done` - Extraction Done
        * `extraction_failed` - Extraction Failed
    AnchorEnum:
      enum:
      - document_date
      - date_added
      type: string
      description: |-
        * `document_date` - Document Date
        * `date_added` - Date Added
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: string
        document:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/ActionEnum'
        changes:
          nullable: true
        context: {}
      required:
      - action
      - id
      - timestamp
    BackendEnum:
      enum:
      - filesystem
      - s3
      type: string
      description: |-
        * `filesystem` - Filesystem
        * `s3` - S3
    BlankEnum:
      enum:
      - ''
    DefaultLockModeEnum:
      enum:
      - COMPLIANCE
      - GOVERNANCE
      type: string
      description: |-
        * `COMPLIANCE` - Compliance
        * `GOVERNANCE` - Governance
    DocumentDetail:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        document_type:
          type: string
          readOnly: true
        document_date:
          type: string
          format: date
          nullable: true
        date_added:
          type: string
          format: date-time
          readOnly: true
        added_by:
          type: string
          readOnly: true
        metadata: {}
        archived:
          type: string
          readOnly: true
        retention_until:
          type: string
          format: date
          nullable: true
        in_compliance_mode:
          type: boolean
          readOnly: true
        notes:
          type: string
        content:
          type: string
        mime_type:
          type: string
          readOnly: true
        versions:
          type: array
          items:
            $ref: '#/components/schemas/DocumentVersion'
          readOnly: true
      required:
      - added_by
      - archived
      - date_added
      - document_type
      - in_compliance_mode
      - mime_type
      - title
      - uuid
      - versions
    DocumentType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        parent:
          type: string
          writeOnly: true
          nullable: true
        parent_slug:
          type: string
          readOnly: true
        depth:
          type: integer
          readOnly: true
        retention_policy:
          type: integer
          nullable: true
        storage:
          type: integer
          nullable: true
        stop_acl_inheritance:
          type: boolean
        is_active:
          type: boolean
        metadata_fields:
          type: array
          items:
            $ref: '#/components/schemas/MetadataFieldDefinition'
          readOnly: true
      required:
      - depth
      - id
      - metadata_fields
      - name
      - parent_slug
      - slug
    DocumentVersion:
      type: object
      properties:
        number:
          type: integer
          maximum: 2147483647
          minimum: 0
        original_filename:
          type: string
          maxLength: 255
        mime_type:
          type: string
          maxLength: 255
        size:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        checksum_sha256:
          type: string
          maxLength: 64
        extraction_status:
          $ref: '#/components/schemas/ExtractionStatusEnum'
        extraction_backend:
          type: string
          maxLength: 100
        is_hidden:
          type: boolean
        hidden_by:
          type: string
          readOnly: true
        hidden_at:
          type: string
          format: date-time
          nullable: true
        hidden_reason:
          type: string
          maxLength: 255
        uploaded_by:
          type: string
          readOnly: true
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
        object_lock_until:
          type: string
          format: date-time
          nullable: true
        page_count:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
      required:
      - checksum_sha256
      - hidden_by
      - mime_type
      - number
      - original_filename
      - size
      - uploaded_at
      - uploaded_by
    ExtractionStatusEnum:
      enum:
      - pending
      - running
      - done
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `running` - Running
        * `done` - Done
        * `failed` - Failed
    FieldTypeEnum:
      enum:
      - date
      - float
      - integer
      - url
      - monetary
      - bool
      - text
      type: string
      description: |-
        * `date` - Date
        * `float` - Float
        * `integer` - Integer
        * `url` - Url
        * `monetary` - Monetary
        * `bool` - Bool
        * `text` - Text
    Index:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        root_document_type:
          type: string
          nullable: true
        shared:
          type: boolean
        levels:
          type: array
          items:
            $ref: '#/components/schemas/IndexLevel'
      required:
      - id
      - levels
      - name
      - slug
    IndexLevel:
      type: object
      properties:
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        source:
          $ref: '#/components/schemas/SourceEnum'
        source_key:
          description: metadata key when source=metadata
          oneOf:
          - type: string
            maxLength: 50
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        transform:
          $ref: '#/components/schemas/TransformEnum'
        descending:
          type: boolean
      required:
      - position
      - source
    MetadataFieldDefinition:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        key:
          type: string
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          maxLength: 100
        field_type:
          $ref: '#/components/schemas/FieldTypeEnum'
        required:
          type: boolean
        default:
          nullable: true
        ordering:
          type: integer
          maximum: 2147483647
          minimum: 0
        indexed:
          type: boolean
          description: Create a functional DB index for tree views / sorting
      required:
      - field_type
      - id
      - key
      - label
    NullEnum:
      enum:
      - null
    PaginatedAuditLogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
    PaginatedDocumentDetailList:
