          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/DocumentDetail'
    PaginatedDocumentTypeList:
      type: object
      required:
      - count
      - results
      properties:
        count:
