openapi: 3.0.3
info:
  title: DMS API
  version: 1.0.0
  description: Company document management system
paths:
  /api/v1/audit/:
    get:
      operationId: v1_audit_list
      description: |-
        Global audit browser (admin only). Per-document history is available to
        normal users through the document timeline endpoint.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - acl_change
          - archive
          - create
          - delete
          - download
          - edit_fields
          - edit_metadata
          - extraction_done
          - extraction_failed
          - type_change
          - unarchive
          - version_hide
          - version_replace_file
          - version_unhide
          - version_upload
          - view
        description: |-
          * `create` - Create
          * `edit_metadata` - Edit Metadata
          * `edit_fields` - Edit Fields
          * `version_upload` - Version Upload
          * `version_replace_file` - Version Replace File
          * `version_hide` - Version Hide
          * `version_unhide` - Version Unhide
          * `acl_change` - Acl Change
          * `type_change` - Type Change
          * `download` - Download
          * `view` - View
          * `archive` - Archive
          * `unarchive` - Unarchive
          * `delete` - Delete
          * `extraction_done` - Extraction Done
          * `extraction_failed` - Extraction Failed
      - in: query
        name: actor
        schema:
          type: integer
      - in: query
        name: document
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - v1
      security:
      - knoxApiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit/{id}/:
    get:
